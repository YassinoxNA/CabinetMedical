spring.application.name=cabinet-dentaire-backend

# Charge le fichier .env depuis la racine courante ou la racine du monorepo.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cabinet_dentaire}
spring.datasource.username=${DB_USERNAME:cabinet_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=Africa/Casablanca
spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=600MB

server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never

app.security.jwt-secret-base64=${JWT_SECRET_B64}
app.security.access-token-ttl=PT15M
app.security.refresh-token-ttl=P7D
app.security.allowed-origin=${DESKTOP_ORIGIN:http://localhost:5173}
app.installation.id=${INSTALLATION_ID:development}
app.installation.created-at=${INSTALLATION_CREATED_AT:0}
app.emergency-read-only=${APP_EMERGENCY_READ_ONLY:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

app.backup.pg-dump-path=${PG_DUMP_PATH:C:/Program Files/PostgreSQL/18/bin/pg_dump.exe}
app.backup.pg-restore-path=${PG_RESTORE_PATH:C:/Program Files/PostgreSQL/18/bin/pg_restore.exe}
app.backup.directory=${BACKUP_DIR:./backups}
app.backup.external-config-file=${BACKUP_EXTERNAL_CONFIG_FILE:./backup-external-dir.txt}
app.backup.retention-count=${BACKUP_RETENTION_COUNT:30}
app.backup.check-interval-ms=${BACKUP_CHECK_INTERVAL_MS:3600000}

# Comptes initiaux temporaires. Les valeurs réelles sont fournies par le fichier .env.
app.initial-accounts.doctor-password=${INITIAL_DOCTOR_PASSWORD:}
app.initial-accounts.assistant-password=${INITIAL_ASSISTANT_PASSWORD:}
app.initial-accounts.doctor-username=${INITIAL_DOCTOR_USERNAME:}
app.initial-accounts.assistant-username=${INITIAL_ASSISTANT_USERNAME:}
