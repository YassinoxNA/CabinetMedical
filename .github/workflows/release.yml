name: Publier une mise a jour Cabinet Dentaire

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version interne (exemple: 1.7.4)"
        required: true
        type: string
      database_migration:
        description: "Cette version contient une migration Flyway"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || '1.7.3' }}
      CABINET_DATABASE_MIGRATION: ${{ inputs.database_migration || 'false' }}

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tester et construire Spring Boot
        working-directory: backend
        run: mvn --batch-mode clean verify

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances Frontend
        working-directory: frontend
        run: npm ci

      - name: Definir la version interne
        working-directory: frontend
        shell: pwsh
        run: npm version $env:RELEASE_VERSION --allow-same-version --no-git-tag-version

      - name: Definir le numero de build
        shell: pwsh
        run: |
          $build = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Set-Content -LiteralPath "frontend/build/update-build.json" -Value "{`n  `"build`": $build`n}"
          "CABINET_BUILD_NUMBER=$build" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Construire le Setup Windows
        working-directory: frontend
        run: npm run dist:win

      - name: Creer latest.json
        working-directory: frontend
        shell: pwsh
        run: |
          $asset = "Cabinet-Dentaire-Setup-$env:RELEASE_VERSION-RESEAU.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/v$env:RELEASE_VERSION/$asset"
          node scripts/create-update-manifest.mjs $url

      - name: Publier GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $setup = "frontend/release/Cabinet-Dentaire-Setup-$env:RELEASE_VERSION-RESEAU.exe"
          $blockmap = "$setup.blockmap"
          $manifest = "frontend/release/update/latest.json"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $setup $blockmap $manifest --repo "${{ github.repository }}" --clobber
            gh release edit $tag --repo "${{ github.repository }}" --latest
          } else {
            gh release create $tag $setup $blockmap $manifest --repo "${{ github.repository }}" --title "Mise a jour Cabinet Dentaire" --generate-notes --latest
          }
